[workspace]
resolver = "3"
members = ["crates/*"]
default-members = ["crates/capsula-cli"]

[workspace.package]
version = "0.9.1"
edition = "2024"
rust-version = "1.89"
readme = "README.md"
repository = "https://github.com/shunichironomura/capsula"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
anyhow = "1"
capsula-capture-command = { path = "crates/capsula-capture-command", version = "0.9.1" }
capsula-capture-cwd = { path = "crates/capsula-capture-cwd", version = "0.9.1" }
capsula-capture-env = { path = "crates/capsula-capture-env", version = "0.9.1" }
capsula-capture-file = { path = "crates/capsula-capture-file", version = "0.9.1" }
capsula-capture-git-repo = { path = "crates/capsula-capture-git-repo", version = "0.9.1" }
capsula-capture-machine = { path = "crates/capsula-capture-machine", version = "0.9.1" }
capsula-cli = { path = "crates/capsula-cli", version = "0.9.1" }
capsula-config = { path = "crates/capsula-config", version = "0.9.1" }
capsula-core = { path = "crates/capsula-core", version = "0.9.1" }
capsula-notify-slack = { path = "crates/capsula-notify-slack", version = "0.9.1" }
capsula-registry = { path = "crates/capsula-registry", version = "0.9.1" }
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
git2 = "0.20"
glob = "0.3"
names = { version = "0.14", default-features = false }
reqwest = { version = "0.12", features = ["blocking", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
shlex = "1"
sysinfo = "0.37"
thiserror = "2"
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ulid = { version = "1", features = ["serde"] }

[workspace.lints.clippy]
all = "deny"
allow_attributes = { level = "warn", priority = 1 }
allow_attributes_without_reason = { level = "warn", priority = 1 }
cargo = { level = "deny", priority = -1 }
dbg_macro = { level = "warn", priority = 1 }
else_if_without_else = { level = "warn", priority = 1 }
expect_used = { level = "allow", priority = 1 }  # TODO: change to "warn" later
indexing_slicing = { level = "allow", priority = 1 }  # TODO: change to "warn" later
missing_errors_doc = { level = "allow", priority = 1 }  # TODO: change to "warn" later
missing_panics_doc = { level = "allow", priority = 1 }  # TODO: change to "warn" later
nursery = { level = "warn", priority = -1 }
panic = { level = "allow", priority = 1 }  # TODO: change to "warn" later
pedantic = { level = "warn", priority = -1 }
print_stderr = { level = "warn", priority = 1 }
print_stdout = { level = "warn", priority = 1 }
todo = { level = "warn", priority = 1 }
undocumented_unsafe_blocks = { level = "warn", priority = 1 }
unimplemented = { level = "warn", priority = 1 }
unwrap_used = { level = "warn", priority = 1 }

[workspace.lints.rust]
# missing-docs = "warn"
unsafe-code = "warn"
