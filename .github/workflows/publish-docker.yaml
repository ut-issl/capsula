# Publish the capsula-server Docker image to GHCR.
#
# Called by release.yaml as a dist publish job. The release tag does not exist
# yet at this point (dist creates it in the announce job), so the image is
# built from the dispatched commit and tagged with the version from the plan.
name: Publish capsula-server Docker image

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

permissions: {}

jobs:
  publish:
    name: Publish capsula-server Docker image to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/capsula-server
          tags: |
            type=semver,pattern={{version}},value=${{ fromJson(inputs.plan).announcement_tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ fromJson(inputs.plan).announcement_tag }}
            type=semver,pattern={{major}},value=${{ fromJson(inputs.plan).announcement_tag }}
            type=raw,value=latest

      # No GitHub Actions cache: a release build must not read cache entries
      # that other workflows can write (cache poisoning).
      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
