# Publish the capsula-server Docker image to GHCR.
#
# Called by release.yaml as a dist publish job. The release tag does not exist
# yet at this point (dist creates it in the announce job), so the image is
# built from the dispatched commit and tagged with the version from the plan.
name: Publish capsula-server Docker image

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

permissions: {}

jobs:
  publish:
    name: Publish capsula-server Docker image to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/capsula-server
          tags: |
            type=semver,pattern={{version}},value=${{ fromJson(inputs.plan).announcement_tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ fromJson(inputs.plan).announcement_tag }}
            type=semver,pattern={{major}},value=${{ fromJson(inputs.plan).announcement_tag }}
            type=raw,value=latest,enable=${{ !fromJson(inputs.plan).announcement_is_prerelease }}

      # No GitHub Actions cache: a release build must not read cache entries
      # that other workflows can write (cache poisoning).
      - name: Build and push
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
