name: CI
on:
  push:
    branches:
      - main
  pull_request:

env:
  RUSTFLAGS: "-Dwarnings"

jobs:
  checks:
    name: cargo clippy, fmt, doc, check
    runs-on: ubuntu-latest
    env:
      # Test against latest dependency versions, not just MSRV-compatible ones
      CARGO_RESOLVER_INCOMPATIBLE_RUST_VERSIONS: allow
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - run: cargo clippy --workspace --all-targets --all-features
      - run: cargo clippy --workspace --all-targets --no-default-features
      - run: cargo fmt --check --all
      - run: cargo doc --workspace --no-deps
      - run: cargo check --workspace
      - run: git diff --exit-code

  coverage:
    name: Generate and upload coverage to Codecov
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://capsula:capsula@localhost:5432/capsula
    services:
      postgres:
        image: postgres:18@sha256:78481659c47e862334611ccdaf7c369c986b3046da9857112f3b309114a65fb4
        env:
          POSTGRES_USER: capsula
          POSTGRES_PASSWORD: capsula
          POSTGRES_DB: capsula
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@1f2425cdb59f8fffb99ee16a5968edf6f57a2b93 # v2.75.24
        with:
          tool: cargo-llvm-cov

      - name: Install sqlx-cli
        run: cargo install sqlx-cli --no-default-features --features postgres

      - name: Run migrations
        run: |
          cd crates/capsula-server
          sqlx database create
          sqlx migrate run

      - name: Generate coverage
        run: cargo llvm-cov --all-features --workspace --lcov --output-path lcov.info

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@57e3a136b779b570ffcdbf80b3bdc90e7fab3de2 # v6.0.0
        with:
          files: lcov.info
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}

  sqlx-check:
    name: Check SQLx prepared queries are up-to-date
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://capsula:capsula@localhost:5432/capsula
    services:
      postgres:
        image: postgres:18@sha256:78481659c47e862334611ccdaf7c369c986b3046da9857112f3b309114a65fb4
        env:
          POSTGRES_USER: capsula
          POSTGRES_PASSWORD: capsula
          POSTGRES_DB: capsula
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Install sqlx-cli
        run: cargo install sqlx-cli --no-default-features --features postgres
      - name: Run migrations
        run: |
          cd crates/capsula-server
          sqlx database create
          sqlx migrate run
      - name: Check if sqlx prepared queries are up-to-date
        run: cargo sqlx prepare --workspace --check

  msrv:
    # Verify that the crate builds with the declared MSRV (rust-version in Cargo.toml).
    # See: https://doc.rust-lang.org/cargo/guide/continuous-integration.html#verifying-rust-version
    name: Verify MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: taiki-e/install-action@1f2425cdb59f8fffb99ee16a5968edf6f57a2b93 # v2.75.24
        with:
          tool: cargo-hack

      # --rust-version: automatically reads MSRV from Cargo.toml and installs that toolchain
      # --workspace: check all crates in the workspace
      # --all-targets: check bins, libs, tests, examples, benches
      # --ignore-private: skip unpublished crates (only consumers care about MSRV)
      - run: cargo hack check --rust-version --workspace --all-targets --ignore-private

  typos:
    name: Spell check with Typos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Spell check with typos
        uses: crate-ci/typos@cf5f1c29a8ac336af8568821ec41919923b05a83 # v1.45.1

  collect:
    needs: [checks, coverage, sqlx-check, msrv, typos]
    runs-on: ubuntu-latest
    steps:
      - name: Collect results
        run: echo "All checks passed!"
