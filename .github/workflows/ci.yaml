name: CI
on:
  push:
    branches:
      - main
  pull_request:

env:
  RUSTFLAGS: "-Dwarnings"

jobs:
  checks:
    name: cargo clippy, fmt, doc, check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.91.1
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --all-features
      - run: cargo clippy --workspace --all-targets --no-default-features
      - run: cargo fmt --check --all
      - run: cargo doc --workspace --no-deps
      - run: cargo check --workspace
      - run: git diff --exit-code

  coverage:
    name: Generate and upload coverage to Codecov
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://capsula:capsula@localhost:5432/capsula
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: capsula
          POSTGRES_PASSWORD: capsula
          POSTGRES_DB: capsula
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@1.91.1
        with:
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Install sqlx-cli
        run: cargo install sqlx-cli --no-default-features --features postgres

      - name: Run migrations
        run: |
          cd crates/capsula-server
          sqlx database create
          sqlx migrate run

      - name: Generate coverage
        run: cargo llvm-cov --all-features --workspace --lcov --output-path lcov.info

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: lcov.info
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}

  sqlx-check:
    name: Check SQLx prepared queries are up-to-date
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://capsula:capsula@localhost:5432/capsula
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: capsula
          POSTGRES_PASSWORD: capsula
          POSTGRES_DB: capsula
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.91.1
      - uses: Swatinem/rust-cache@v2
      - name: Install sqlx-cli
        run: cargo install sqlx-cli --no-default-features --features postgres
      - name: Run migrations
        run: |
          cd crates/capsula-server
          sqlx database create
          sqlx migrate run
      - name: Check if sqlx prepared queries are up-to-date
        run: cargo sqlx prepare --workspace --check

  typos:
    name: Spell check with Typos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Spell check with typos
        uses: crate-ci/typos@v1.42.2

  collect:
    needs: [checks, coverage, sqlx-check, typos]
    runs-on: ubuntu-latest
    steps:
      - name: Collect results
        run: echo "All checks passed!"
