name: CI
on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

env:
  RUSTFLAGS: "-Dwarnings"

jobs:
  checks:
    name: cargo clippy, fmt, doc, check
    runs-on: ubuntu-latest
    env:
      # Test against latest dependency versions, not just MSRV-compatible ones
      CARGO_RESOLVER_INCOMPATIBLE_RUST_VERSIONS: allow
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: rustup toolchain install --no-self-update
      - uses: Swatinem/rust-cache@v2.9.3
      - run: cargo clippy --workspace --all-targets --all-features
      - run: cargo clippy --workspace --all-targets --no-default-features
      - run: cargo fmt --check --all
      - run: cargo doc --workspace --no-deps
      - run: cargo check --workspace
      - run: git diff --exit-code

  audit:
    name: Audit dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: taiki-e/install-action@v2.88.0
        with:
          tool: cargo-audit

      - run: cargo audit --deny warnings

  coverage:
    name: Generate and upload coverage to Codecov
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://capsula:capsula@localhost:5432/capsula
    services:
      postgres:
        image: postgres:18@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
        env:
          POSTGRES_USER: capsula
          POSTGRES_PASSWORD: capsula
          POSTGRES_DB: capsula
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: rustup toolchain install --no-self-update

      - name: Install llvm-tools-preview
        run: rustup component add llvm-tools-preview

      - uses: Swatinem/rust-cache@v2.9.3

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2.88.0
        with:
          tool: cargo-llvm-cov

      - name: Install sqlx-cli
        run: cargo install sqlx-cli --no-default-features --features postgres

      - name: Run migrations
        run: |
          cd crates/capsula-server
          sqlx database create
          sqlx migrate run

      - name: Generate coverage
        run: cargo llvm-cov --all-features --workspace --lcov --output-path lcov.info

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7.1.1
        with:
          files: lcov.info
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}

  sqlx-check:
    name: Check SQLx prepared queries are up-to-date
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://capsula:capsula@localhost:5432/capsula
    services:
      postgres:
        image: postgres:18@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
        env:
          POSTGRES_USER: capsula
          POSTGRES_PASSWORD: capsula
          POSTGRES_DB: capsula
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: rustup toolchain install --no-self-update
      - uses: Swatinem/rust-cache@v2.9.3
      - name: Install sqlx-cli
        run: cargo install sqlx-cli --no-default-features --features postgres
      - name: Run migrations
        run: |
          cd crates/capsula-server
          sqlx database create
          sqlx migrate run
      - name: Check if sqlx prepared queries are up-to-date
        working-directory: crates/capsula-server
        run: cargo sqlx prepare --check

  msrv:
    # Verify that the crate builds with the declared MSRV (rust-version in Cargo.toml).
    # See: https://doc.rust-lang.org/cargo/guide/continuous-integration.html#verifying-rust-version
    name: Verify MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: rustup toolchain install --no-self-update

      - uses: taiki-e/install-action@v2.88.0
        with:
          tool: cargo-hack

      # --rust-version: automatically reads MSRV from Cargo.toml and installs that toolchain
      # --workspace: check all crates in the workspace
      # --all-targets: check bins, libs, tests, examples, benches
      # --ignore-private: skip unpublished crates (only consumers care about MSRV)
      - run: cargo hack check --rust-version --workspace --all-targets --ignore-private

  typos:
    name: Spell check with Typos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Spell check with typos
        uses: crate-ci/typos@v1.51.1

  actions-lock:
    name: Verify actions lockfile
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install gh-actions-lock
        run: gh extension install github/gh-actions-lock --pin v0.4.1
      - name: Verify .github/workflows/actions.lock
        run: gh actions-lock --verify

  collect:
    if: ${{ always() }}
    needs: [checks, audit, coverage, sqlx-check, msrv, typos, actions-lock]
    runs-on: ubuntu-latest
    steps:
      - name: Require every job to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: echo "$RESULTS" | jq -e 'all(.[]; .result == "success")'
