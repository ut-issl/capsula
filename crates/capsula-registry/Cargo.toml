[package]
name = "capsula-registry"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "A Capsula hooks registry."
readme.workspace = true
repository.workspace = true
license.workspace = true

[dependencies]
capsula-capture-command = { workspace = true, optional = true }
capsula-capture-cwd = { workspace = true, optional = true }
capsula-capture-env = { workspace = true, optional = true }
capsula-capture-file = { workspace = true, optional = true }
capsula-capture-git-repo = { workspace = true, optional = true }
capsula-capture-machine = { workspace = true, optional = true }
capsula-core = { workspace = true }
capsula-notify-slack = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[features]
default = [
  "hook-command",
  "hook-cwd",
  "hook-env",
  "hook-file",
  "hook-git",
  "hook-machine",
  "hook-slack",
]
hook-command = ["dep:capsula-capture-command"]
hook-cwd = ["dep:capsula-capture-cwd"]
hook-env = ["dep:capsula-capture-env"]
hook-file = ["dep:capsula-capture-file"]
hook-git = ["dep:capsula-capture-git-repo"]
hook-machine = ["dep:capsula-capture-machine"]
hook-slack = ["dep:capsula-notify-slack"]

[lints]
workspace = true
