[package]
name = "capsula"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "The command line interface for Capsula."
readme.workspace = true
repository.workspace = true
license.workspace = true
keywords = ["capsula", "cli"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "capsula"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
capsula-client = { workspace = true }
capsula-config = { workspace = true }
capsula-tui = { workspace = true }
capsula-core = { workspace = true }
capsula-orchestration = { workspace = true }
capsula-registry = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true }
serde_json = { workspace = true }
shlex = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
walkdir = "2"

[dev-dependencies]
assert_cmd = "=2.2.2"
predicates = "=3.1.4"
serde = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true

# `cargo binstall capsula` downloads the archives that the `Release` workflow
# (dist) attaches to the GitHub Release; see RELEASING.md.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }{ archive-suffix }"
pkg-fmt = "tgz"
bin-dir = "{ name }-{ target }/{ bin }{ binary-ext }"
# Never fall back to third-party binaries built by cargo-quickinstall.
disabled-strategies = ["quick-install"]

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"
bin-dir = "{ bin }{ binary-ext }"
