[package]
name = "capsula-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Web server for managing and viewing Capsula runs"
readme.workspace = true
repository.workspace = true
license.workspace = true
keywords = ["capsula", "server", "web"]
categories = ["web-programming::http-server"]

[dependencies]
askama = { workspace = true }
askama_web = { workspace = true }
axum = { workspace = true }
bytes = { workspace = true }
chrono = { workspace = true }
capsula-core = { workspace = true }
clap = { workspace = true }
futures = { workspace = true }
mime_guess = { workspace = true }
object_store = { workspace = true }
serde = { workspace = true }
percent-encoding = { workspace = true }
serde_json = { workspace = true }
sql-json-path = { workspace = true }
sqlx = { workspace = true, features = ["migrate"] }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
url = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
reqwest = { workspace = true }
sha2 = { workspace = true }
tempfile = { workspace = true }
testcontainers-modules = { workspace = true }

[lints]
workspace = true

# The server is distributed as a Docker image, not as a dist binary.
[package.metadata.dist]
dist = false
